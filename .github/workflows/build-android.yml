name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.php"
      - "script.js"
      - "style.css"
      - "modern.css"
      - "studio.css"
      - "studio.js"
      - "studio-next.js"
      - "studio-center.js"
      - "studio-next.css"
      - "studio-touch.css"
      - "images/**"
      - "images/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/build-native-web.mjs"
      - "native/**"
      - ".github/test-in-app-apk-update.mjs"
      - ".github/workflows/build-android.yml"
      - ".github/test-native-media.mjs"
      - ".github/test-smart-radio.mjs"
      - ".github/test-personal-radio.mjs"
      - ".github/test-continuous-radio.mjs"
      - ".github/test-source-switch.mjs"
      - ".github/test-quick-mixes.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dagstudio-player-android
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install native dependencies
        run: npm install --no-audit --no-fund

      - name: Verify trusted server IP with original HTTPS hostname
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 35 --retry 2 --retry-delay 2 \
            --resolve pl.dagstudio.ru:443:188.127.241.85 \
            -H 'Content-Type: application/json' \
            --data '{"action":"search_global","query":"Miyagi","page":1,"network":"weak"}' \
            https://pl.dagstudio.ru/api.php -o /tmp/dag-pinned-api.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/dag-pinned-api.json'))
          assert payload.get('success') is True and isinstance(payload.get('data'),list), 'Trusted IP did not reach the official HTTPS API'
          print('TRUSTED_IP_TLS_AND_SEARCH_OK',len(payload['data']))
          PY

      - name: Test verified IP fallback for CC3 DNS failures
        run: node .github/test-trusted-ip-dns.mjs

      - name: Test in-app Android APK updater
        run: node .github/test-in-app-apk-update.mjs

      - name: Test WebView fallback for CC3 DNS failures
        run: node .github/test-native-http-fallback.mjs

      - name: Test search/API/OTA network faults
        run: node .github/test-end-to-end-network.mjs

      - name: Check network error classification
        run: node .github/test-connectivity.mjs

      - name: Test signed OTA manifest and fallback
        run: node .github/test-ota-update.mjs

      - name: Test native progress and touch seeking
        run: node .github/test-native-media.mjs

      - name: Test bounded offline playlist downloads
        run: node .github/test-offline-batch.mjs

      - name: Test smart radio recommendations
        run: node .github/test-smart-radio.mjs

      - name: Test private personalized radio
        run: node .github/test-personal-radio.mjs

      - name: Test continuous Wave and Charts discovery
        run: node .github/test-continuous-radio.mjs

      - name: Test alternate stream source failover
        run: node .github/test-source-switch.mjs

      - name: Test quick mixes and favorite
        run: node .github/test-quick-mixes.mjs

      - name: Build local web shell
        env:
          DAG_NATIVE_BUILD_VERSION: "1.0.${{ github.run_number }}-preview"
        run: npm run native:web

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          # Native-поддержка CC3 добавляется в созданный Capacitor-проект.
          test -f native/android/MainActivity.java
          test -f native/android/DAGCarModePlugin.java
          mkdir -p android/app/src/main/java/ru/dagstudio/player
          cp native/android/MainActivity.java android/app/src/main/java/ru/dagstudio/player/MainActivity.java
          cp native/android/DAGCarModePlugin.java android/app/src/main/java/ru/dagstudio/player/DAGCarModePlugin.java
          cp native/android/DAGMediaService.java android/app/src/main/java/ru/dagstudio/player/DAGMediaService.java
          cp native/android/DAGAudioEngine.java android/app/src/main/java/ru/dagstudio/player/DAGAudioEngine.java
          cp native/android/DAGServerDns.java android/app/src/main/java/ru/dagstudio/player/DAGServerDns.java
          cp native/android/DAGApkUpdater.java android/app/src/main/java/ru/dagstudio/player/DAGApkUpdater.java
          node scripts/configure-android-media.mjs
          cat >> android/app/build.gradle <<'MEDIA3_GRADLE'

          dependencies {
              implementation "androidx.media3:media3-exoplayer:1.11.1"
              implementation "androidx.media3:media3-datasource:1.11.1"
              implementation "androidx.media3:media3-datasource-okhttp:1.11.1"
              implementation "com.squareup.okhttp3:okhttp:4.12.0"
              implementation "androidx.media3:media3-database:1.11.1"
          }
          MEDIA3_GRADLE

      - name: Generate DAGSTUDIO icons and splash
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "#0b0b0b" \
            --iconBackgroundColorDark "#0b0b0b" \
            --splashBackgroundColor "#0b0b0b" \
            --splashBackgroundColorDark "#0b0b0b"

      - name: Restore or create permanent Preview signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view android-preview-signing >/dev/null 2>&1; then
            gh release download android-preview-signing --pattern 'dagstudio-preview.jks' --dir android/app
          else
            keytool -genkeypair -v \
              -keystore android/app/dagstudio-preview.jks \
              -storepass dagstudio-preview \
              -keypass dagstudio-preview \
              -alias dagstudio-preview \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DAGSTUDIO PLAYER Preview, OU=DAGSTUDIO, O=DAGSTUDIO, L=Preview, ST=Preview, C=RU"
            gh release create android-preview-signing android/app/dagstudio-preview.jks \
              --title "DAGSTUDIO PLAYER Preview signing key" \
              --notes "Служебный ключ только для Preview package ru.dagstudio.player.preview. Не используется для production." \
              --prerelease
          fi
          test -f android/app/dagstudio-preview.jks

      - name: Configure permanent Preview signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  dagstudioPreview {
                      storeFile file("dagstudio-preview.jks")
                      storePassword "dagstudio-preview"
                      keyAlias "dagstudio-preview"
                      keyPassword "dagstudio-preview"
                  }
              }
              buildTypes {
                  debug {
                      applicationIdSuffix ".preview"
                      versionNameSuffix "-preview"
                      signingConfig signingConfigs.dagstudioPreview
                  }
              }
          }
          GRADLE

      - name: Set Preview application version
        run: |
          set -e
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME_BASE="1.0.$GITHUB_RUN_NUMBER"
          VERSION_DISPLAY="$VERSION_NAME_BASE-preview"
          echo "DAG_NATIVE_VERSION=$VERSION_DISPLAY" >> "$GITHUB_ENV"
          echo "DAG_NATIVE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME_BASE\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build Preview APK
        working-directory: android
        run: |
          # Smaller Gradle binary + retries handle intermittent GitHub 502s.
          sed -i 's/-all.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon assembleDebug; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "Gradle unavailable; retrying build ($attempt/4)..."
            sleep $((attempt * 10))
          done

      - name: Verify Preview APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk DAGSTUDIO-PLAYER-Preview.apk
          sha256sum DAGSTUDIO-PLAYER-Preview.apk > DAGSTUDIO-PLAYER-Preview.apk.sha256
          unzip -t DAGSTUDIO-PLAYER-Preview.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs DAGSTUDIO-PLAYER-Preview.apk
          ls -lh DAGSTUDIO-PLAYER-Preview.apk

      - name: Create native update metadata
        run: |
          set -e
          APK_SHA="$(awk '{print $1}' DAGSTUDIO-PLAYER-Preview.apk.sha256)"
          cat > DAGSTUDIO-PLAYER-native-version.json <<JSON
          {
            "version": "$DAG_NATIVE_VERSION",
            "version_code": $DAG_NATIVE_VERSION_CODE,
            "url": "https://github.com/dagxam/player_dagstudio/releases/download/android-preview/DAGSTUDIO-PLAYER-Preview.apk",
            "sha256": "$APK_SHA",
            "commit": "$GITHUB_SHA"
          }
          JSON
          python -m json.tool DAGSTUDIO-PLAYER-native-version.json >/dev/null

      - name: Upload Preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAGSTUDIO-PLAYER-Android-Preview
          path: |
            DAGSTUDIO-PLAYER-Preview.apk
            DAGSTUDIO-PLAYER-Preview.apk.sha256
            DAGSTUDIO-PLAYER-native-version.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent GitHub Preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Автоматическая Preview-сборка DAGSTUDIO PLAYER $DAG_NATIVE_VERSION. Package: ru.dagstudio.player.preview. Commit: $GITHUB_SHA"
          if gh release view android-preview >/dev/null 2>&1; then
            gh release upload android-preview DAGSTUDIO-PLAYER-Preview.apk DAGSTUDIO-PLAYER-Preview.apk.sha256 DAGSTUDIO-PLAYER-native-version.json --clobber
            gh release edit android-preview --title "DAGSTUDIO PLAYER Android Preview" --notes "$NOTES" --prerelease
          else
            gh release create android-preview DAGSTUDIO-PLAYER-Preview.apk DAGSTUDIO-PLAYER-Preview.apk.sha256 DAGSTUDIO-PLAYER-native-version.json \
              --title "DAGSTUDIO PLAYER Android Preview" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Prepare HTTPS APK mirror for TEYES CC3
        run: |
          set -euo pipefail
          mkdir -p apk-publish
          BASE_VERSION="${DAG_NATIVE_VERSION%-preview}"
          APK_NAME="DAGSTUDIO-PLAYER-Preview-$BASE_VERSION.apk"
          cp DAGSTUDIO-PLAYER-Preview.apk "apk-publish/$APK_NAME"
          python - "$BASE_VERSION" "$APK_NAME" "$GITHUB_SHA" "$DAG_NATIVE_VERSION_CODE" <<'PY'
          import json,sys,hashlib,pathlib
          version,name,commit,code=sys.argv[1:]
          payload={
            "version":version+"-preview",
            "version_code":int(code),
            "url":"https://pl.dagstudio.ru/apk/"+name,
            "sha256":hashlib.sha256(pathlib.Path("apk-publish",name).read_bytes()).hexdigest(),
            "commit":commit
          }
          pathlib.Path("apk-publish/DAGSTUDIO-PLAYER-native-version.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Deploy APK mirror for DNS-restricted CC3 devices
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./apk-publish/
          server-dir: /www/pl.dagstudio.ru/apk/

      - name: Verify HTTPS APK mirror, SHA256 and release identity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 45 --retry 3 --retry-delay 2 \
            --resolve pl.dagstudio.ru:443:188.127.241.85 \
            https://pl.dagstudio.ru/apk/DAGSTUDIO-PLAYER-native-version.json \
            -o /tmp/dag-native-meta.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/dag-native-meta.json'))
          assert data["commit"]==os.environ["GITHUB_SHA"]
          assert data["version"]==os.environ["DAG_NATIVE_VERSION"]
          assert data["url"].startswith("https://pl.dagstudio.ru/apk/DAGSTUDIO-PLAYER-Preview-")
          PY
          URL="$(python -c 'import json; print(json.load(open("/tmp/dag-native-meta.json"))["url"])')"
          curl --fail --silent --show-error --location --max-time 180 --retry 2 --retry-delay 2 \
            --resolve pl.dagstudio.ru:443:188.127.241.85 "$URL" \
            -o /tmp/dag-native-public.apk
          test "$(sha256sum /tmp/dag-native-public.apk | awk '{print $1}')" = \
            "$(python -c 'import json; print(json.load(open("/tmp/dag-native-meta.json"))["sha256"])')"
          unzip -t /tmp/dag-native-public.apk >/dev/null
          echo "NATIVE_APK_MIRROR_TLS_SHA256_OK"
