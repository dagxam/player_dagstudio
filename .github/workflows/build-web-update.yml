name: Publish Android Web Update

on:
  push:
    branches:
      - main
    paths:
      - "index.php"
      - "script.js"
      - "style.css"
      - "images/**"
      - "scripts/build-native-web.mjs"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dagstudio-player-web-update
  cancel-in-progress: true

jobs:
  publish-web:
    name: Publish live web bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build native web bundle
        run: npm run native:web

      - name: Validate bundle
        run: |
          set -e
          test -f www/index.html
          test -f www/script.js
          test -f www/style.css
          test -f www/native-bridge.js
          node --check www/script.js
          node --check www/native-bridge.js
          grep -q 'DAG_NATIVE_APP' www/index.html
          grep -q "$GITHUB_SHA" www/index.html
          grep -q 'https://pl.dagstudio.ru' www/script.js

      - name: Package live update with Capgo CLI
        run: |
          set -e
          VERSION="1000.0.$GITHUB_RUN_NUMBER"
          rm -f DAGSTUDIO-PLAYER-web DAGSTUDIO-PLAYER-web.zip DAGSTUDIO-PLAYER-web-version.json

          npx @capgo/cli@latest bundle zip ru.dagstudio.player.preview             --path www             --bundle "$VERSION"             --name DAGSTUDIO-PLAYER-web             --no-code-check

          if [ -f DAGSTUDIO-PLAYER-web ]; then
            mv DAGSTUDIO-PLAYER-web DAGSTUDIO-PLAYER-web.zip
          elif [ -f DAGSTUDIO-PLAYER-web.zip ]; then
            true
          else
            GENERATED="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
            test -n "$GENERATED"
            mv "$GENERATED" DAGSTUDIO-PLAYER-web.zip
          fi

          unzip -t DAGSTUDIO-PLAYER-web.zip >/dev/null
          unzip -Z1 DAGSTUDIO-PLAYER-web.zip | grep -Eq '(^|/)index\.html$'

          CHECKSUM="$(sha256sum DAGSTUDIO-PLAYER-web.zip | awk '{print $1}')"
          cat > DAGSTUDIO-PLAYER-web-version.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://github.com/dagxam/player_dagstudio/releases/download/android-web/DAGSTUDIO-PLAYER-web.zip",
            "checksum": "$CHECKSUM",
            "sha256": "$CHECKSUM",
            "commit": "$GITHUB_SHA"
          }
          JSON

          python -m json.tool DAGSTUDIO-PLAYER-web-version.json >/dev/null
          echo "Live update version: $VERSION"
          echo "Live update checksum: $CHECKSUM"

      - name: Publish permanent live-update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Автоматический web-layer update DAGSTUDIO PLAYER. Commit: $GITHUB_SHA"
          if gh release view android-web >/dev/null 2>&1; then
            gh release upload android-web DAGSTUDIO-PLAYER-web.zip DAGSTUDIO-PLAYER-web-version.json --clobber
            gh release edit android-web               --title "DAGSTUDIO PLAYER Web Update"               --notes "$NOTES"               --prerelease
          else
            gh release create android-web               DAGSTUDIO-PLAYER-web.zip               DAGSTUDIO-PLAYER-web-version.json               --title "DAGSTUDIO PLAYER Web Update"               --notes "$NOTES"               --prerelease
          fi
