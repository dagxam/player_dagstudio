name: Publish Android Web Update

on:
  push:
    branches:
      - main
    paths:
      - "index.php"
      - "script.js"
      - "style.css"
      - "modern.css"
      - "studio.css"
      - "studio.js"
      - "studio-next.js"
      - "studio-center.js"
      - "studio-next.css"
      - "studio-touch.css"
      - "images/**"
      - "vendor/fontawesome/**"
      - "scripts/build-native-web.mjs"
      - "native/native-bridge.js"
      - "native/native-audio-adapter.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dagstudio-player-web-update
  cancel-in-progress: true

jobs:
  publish-web:
    name: Publish live web bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build native web bundle
        run: npm run native:web

      - name: Validate bundle
        run: |
          set -e
          test -f www/index.html
          test -f www/script.js
          test -f www/style.css
          test -f www/modern.css
          test -f www/studio.css
          test -f www/studio.js
          test -f www/studio-touch.css
          node --check www/studio.js
          test -f www/native-bridge.js
          test -s www/vendor/fontawesome/css/all.min.css
          for font in solid-900 regular-400 brands-400; do
            test -s "www/vendor/fontawesome/webfonts/fa-$font.woff2"
          done
          ! grep -qi 'cdnjs.cloudflare.com/ajax/libs/font-awesome' www/index.html
          node --check www/script.js
          node --check www/native-bridge.js
          grep -q 'DAG_NATIVE_APP' www/index.html
          grep -q "$GITHUB_SHA" www/index.html
          grep -q 'https://pl.dagstudio.ru' www/script.js

      - name: Test fast startup and OTA-only update actions
        run: |
          node .github/test-fast-start.mjs
          node .github/test-profile-theme.mjs
          node .github/test-local-icons.mjs
          node .github/test-source-health.mjs
          node .github/test-caucasus-catalogs.mjs
          node .github/test-official-music.mjs

      # Includes verified-IP search and remote theme synchronization changes.
      - name: Test manual OTA and backup delivery
        run: node .github/test-ota-update.mjs

      - name: Package live update with Capgo CLI
        run: |
          set -e
          VERSION="1000.0.$GITHUB_RUN_NUMBER"
          rm -f DAGSTUDIO-PLAYER-web DAGSTUDIO-PLAYER-web.zip DAGSTUDIO-PLAYER-web-version.json

          npx @capgo/cli@latest bundle zip ru.dagstudio.player.preview             --path www             --bundle "$VERSION"             --name DAGSTUDIO-PLAYER-web             --no-code-check

          if [ -f DAGSTUDIO-PLAYER-web ]; then
            mv DAGSTUDIO-PLAYER-web DAGSTUDIO-PLAYER-web.zip
          elif [ -f DAGSTUDIO-PLAYER-web.zip ]; then
            true
          else
            GENERATED="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
            test -n "$GENERATED"
            mv "$GENERATED" DAGSTUDIO-PLAYER-web.zip
          fi

          unzip -t DAGSTUDIO-PLAYER-web.zip >/dev/null
          unzip -Z1 DAGSTUDIO-PLAYER-web.zip | grep -Eq '(^|/)index\.html$'

          CHECKSUM="$(sha256sum DAGSTUDIO-PLAYER-web.zip | awk '{print $1}')"
          cat > DAGSTUDIO-PLAYER-web-version.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://github.com/dagxam/player_dagstudio/releases/download/android-web/DAGSTUDIO-PLAYER-web.zip",
            "checksum": "$CHECKSUM",
            "sha256": "$CHECKSUM",
            "commit": "$GITHUB_SHA"
          }
          JSON

          python -m json.tool DAGSTUDIO-PLAYER-web-version.json >/dev/null
          echo "Live update version: $VERSION"
          echo "Live update checksum: $CHECKSUM"

      - name: Prepare primary OTA files for direct delivery
        run: |
          set -euo pipefail
          VERSION="1000.0.$GITHUB_RUN_NUMBER"
          mkdir -p ota-publish
          VERSIONED_ZIP="DAGSTUDIO-PLAYER-web-$VERSION.zip"
          cp DAGSTUDIO-PLAYER-web.zip "ota-publish/$VERSIONED_ZIP"
          SHA256="$(sha256sum "ota-publish/$VERSIONED_ZIP" | cut -d ' ' -f 1)"
          python - "$VERSION" "$VERSIONED_ZIP" "$SHA256" "$GITHUB_SHA" <<'PY'
          import json,sys,pathlib
          version,name,sha,commit=sys.argv[1:]
          payload={
            "version":version,
            "url":"https://pl.dagstudio.ru/ota/"+name,
            "fallback_url":"https://github.com/dagxam/player_dagstudio/releases/download/android-web/DAGSTUDIO-PLAYER-web.zip",
            "checksum":sha,
            "sha256":sha,
            "commit":commit
          }
          pathlib.Path("ota-publish/DAGSTUDIO-PLAYER-web-version.json").write_text(
            json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          PY
          test -s ota-publish/DAGSTUDIO-PLAYER-web-version.json

      - name: Publish permanent live-update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Автоматический web-layer update DAGSTUDIO PLAYER. Commit: $GITHUB_SHA"
          if gh release view android-web >/dev/null 2>&1; then
            gh release upload android-web DAGSTUDIO-PLAYER-web.zip DAGSTUDIO-PLAYER-web-version.json --clobber
            gh release edit android-web               --title "DAGSTUDIO PLAYER Web Update"               --notes "$NOTES"               --prerelease
          else
            gh release create android-web               DAGSTUDIO-PLAYER-web.zip               DAGSTUDIO-PLAYER-web-version.json               --title "DAGSTUDIO PLAYER Web Update"               --notes "$NOTES"               --prerelease
          fi

      - name: Publish OTA directly to the DAGSTUDIO website
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./ota-publish/
          server-dir: /www/pl.dagstudio.ru/ota/

      - name: Verify primary OTA manifest and ZIP from public URL
        run: |
          set -euo pipefail
          VERSION="1000.0.$GITHUB_RUN_NUMBER"
          URL="https://pl.dagstudio.ru/ota/DAGSTUDIO-PLAYER-web-version.json?verify=$GITHUB_SHA"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 45 "$URL" -o /tmp/dag-ota.json
          python - "$VERSION" "$GITHUB_SHA" <<'PY'
          import json,sys,re
          info=json.load(open('/tmp/dag-ota.json'))
          version,commit=sys.argv[1:]
          assert info.get('version')==version, 'OTA version was not published'
          assert info.get('commit')==commit, 'OTA belongs to another commit'
          assert re.fullmatch('[a-f0-9]{64}',info.get('checksum','')), 'Missing SHA-256'
          assert info.get('url')==f'https://pl.dagstudio.ru/ota/DAGSTUDIO-PLAYER-web-{version}.zip'
          PY
          OTA_URL="$(python -c 'import json;print(json.load(open("/tmp/dag-ota.json"))["url"])')"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 90 "$OTA_URL" -o /tmp/dag-ota-public.zip
          ZIP_SHA="$(sha256sum /tmp/dag-ota-public.zip | cut -d ' ' -f1)"
          EXPECTED_SHA="$(python -c 'import json;print(json.load(open("/tmp/dag-ota.json"))["checksum"])')"
          test "$ZIP_SHA" = "$EXPECTED_SHA"
          unzip -t /tmp/dag-ota-public.zip >/dev/null
          echo "Primary OTA verified: version=$VERSION SHA256=$ZIP_SHA"
