name: CC3 network and offline regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "script.js"
      - "index.php"
      - ".github/test-*.mjs"
      - ".github/workflows/cc3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: JavaScript syntax and secure-network tests
        run: |
          node --check script.js
          node --check native/native-bridge.js
          node .github/test-cc3-offline-failover.mjs
          node .github/test-trusted-ip-dns.mjs
          node .github/test-native-http-fallback.mjs
          node .github/test-end-to-end-network.mjs
          node .github/test-weak-network.mjs
          node .github/test-native-media.mjs
          node .github/test-ota-update.mjs
      - name: Native web bundle
        run: |
          npm run native:web
          node --check www/script.js
          node --check www/native-bridge.js
          test -s www/index.html
