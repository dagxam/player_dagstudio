name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 16 SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare native app
        run: |
          npm run native:web
          rm -rf android
          npx cap add android
          npx cap sync android
          # Подключаем идентичный модуль стабилизации TEYES CC3 в release.
          mkdir -p android/app/src/main/java/ru/dagstudio/player
          cp native/android/MainActivity.java android/app/src/main/java/ru/dagstudio/player/MainActivity.java
          cp native/android/DAGCarModePlugin.java android/app/src/main/java/ru/dagstudio/player/DAGCarModePlugin.java
          npx @capacitor/assets generate --android             --iconBackgroundColor "#0b0b0b"             --iconBackgroundColorDark "#0b0b0b"             --splashBackgroundColor "#0b0b0b"             --splashBackgroundColorDark "#0b0b0b"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/dagstudio-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          DAG_KEYSTORE_FILE: dagstudio-release.jks
          DAG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  dagstudioRelease {
                      storeFile file(System.getenv("DAG_KEYSTORE_FILE"))
                      storePassword System.getenv("DAG_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("DAG_KEY_ALIAS")
                      keyPassword System.getenv("DAG_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dagstudioRelease
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" DAGSTUDIO-PLAYER.apk
          sha256sum DAGSTUDIO-PLAYER.apk > DAGSTUDIO-PLAYER.apk.sha256
          unzip -t DAGSTUDIO-PLAYER.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs DAGSTUDIO-PLAYER.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAGSTUDIO-PLAYER-Release
          path: |
            DAGSTUDIO-PLAYER.apk
            DAGSTUDIO-PLAYER.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             DAGSTUDIO-PLAYER.apk             DAGSTUDIO-PLAYER.apk.sha256             --title "DAGSTUDIO PLAYER $GITHUB_REF_NAME"             --generate-notes
