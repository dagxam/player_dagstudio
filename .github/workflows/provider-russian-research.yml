name: Verify Russian Music Metadata APIs and Publisher Post Dates
on:
  push:
    branches: [research/music-source-probe-2026]
    paths: [.github/workflows/provider-russian-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe publisher metadata APIs and mainstream Russia search
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json
          q=urllib.parse.quote
          targets=[
           ('Zvuk-M posts search','https://zvuk-m.com/wp-json/wp/v2/posts?search='+q('Ислам Итляшев')+'&per_page=3&_fields=id,date,title,link'),
           ('Zvuk-M latest posts','https://zvuk-m.com/wp-json/wp/v2/posts?per_page=3&orderby=date&order=desc&_fields=id,date,title,link'),
           ('Zvuk-M categories','https://zvuk-m.com/wp-json/wp/v2/categories?search='+q('новинки')+'&per_page=5&_fields=id,name,slug'),
           ('Kavkaz posts search','https://kavkazmusic.tv/wp-json/wp/v2/posts?search='+q('Зезаг')+'&per_page=3&_fields=id,date,title,link'),
           ('Kavkaz latest posts','https://kavkazmusic.tv/wp-json/wp/v2/posts?per_page=3&orderby=date&order=desc&_fields=id,date,title,link'),
           ('Kavkaz categories','https://kavkazmusic.tv/wp-json/wp/v2/categories?search='+q('trackcards')+'&per_page=5&_fields=id,name,slug'),
           ('iTunes RU caucasus','https://itunes.apple.com/search?'+urllib.parse.urlencode({'term':'Ислам Итляшев','country':'RU','media':'music','entity':'song','limit':4'})),
           ('iTunes RU russian','https://itunes.apple.com/search?'+urllib.parse.urlencode({'term':'Zivert','country':'RU','media':'music','entity':'song','limit':4'})),
           ('iTunes US russian','https://itunes.apple.com/search?'+urllib.parse.urlencode({'term':'Zivert','country':'US','media':'music','entity':'song','limit':4'})),
           ('Deezer Caucasus','https://api.deezer.com/search?'+urllib.parse.urlencode({'q':'Ислам Итляшев','limit':4'})),
           ('Deezer Russian','https://api.deezer.com/search?'+urllib.parse.urlencode({'q':'Zivert','limit':4'})),
           ('Audius Caucasus latin','https://api.audius.co/v1/tracks/search?'+urllib.parse.urlencode({'query':'Sultan Laguch','limit':4'})),
           ('Audius Miyagi','https://api.audius.co/v1/tracks/search?'+urllib.parse.urlencode({'query':'Miyagi','limit':4'})),
           ('SoundCloud API no key','https://api.soundcloud.com/tracks?q=Zivert&limit=3'),
          ]
          for name,url in targets:
           req=urllib.request.Request(url,headers={'User-Agent':'DAGSTUDIO-PLAYER-Research/1.0 (https://pl.dagstudio.ru)','Accept':'application/json'})
           try:
            with urllib.request.urlopen(req,timeout=12) as response:
             raw=response.read(450000)
             http=response.status
             ctype=response.headers.get('Content-Type','').split(';')[0]
            v=json.loads(raw) if 'json' in ctype or raw.lstrip().startswith((b'[',b'{')) else None
            detail=''
            if isinstance(v,list):
             detail='count='+str(len(v))+' sample='+str([(str(x.get('date',''))[:10],str(x.get('title',{}).get('rendered','') if isinstance(x.get('title'),dict) else x.get('name',''))[:80]) for x in v[:3]])
            elif isinstance(v,dict):
             items=v.get('results',v.get('data',[]))
             count=v.get('resultCount',len(items) if isinstance(items,list) else 0)
             detail='count='+str(count)
             if isinstance(items,list):
              detail+=' sample='+str([{'artist':str(t.get('artistName',t.get('artist',{}).get('name','') if isinstance(t.get('artist'),dict) else ''))[:40],
               'title':str(t.get('trackName',t.get('title','')))[:45],
               'date':str(t.get('releaseDate',t.get('release_date','')))[:24],
               'preview':bool(t.get('previewUrl',t.get('preview')))} for t in items[:3]])
            print('PROBE_RU',name,'http='+str(http),'content='+str(ctype),detail,flush=True)
           except urllib.error.HTTPError as e:print('PROBE_RU',name,'http='+str(e.code),'error='+str(e.reason)[:70],flush=True)
           except Exception as e:print('PROBE_RU',name,'http=0','error='+type(e).__name__,str(e)[:140],flush=True)
          PY
