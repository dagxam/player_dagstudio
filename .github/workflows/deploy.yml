name: Deploy player.dagstudio.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-dagstudio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          for file in ./*.php; do php -l "$file"; done
          node --check script.js
          node --check sw.js
          python -m json.tool manifest.json > /dev/null

      - name: Create deployment marker
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: printf '%s' "$GITHUB_SHA" > deploy-version.txt

      - name: Deploy site over FTP
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      - name: Verify production version
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          EXPECTED="$GITHUB_SHA"
          ACTUAL="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://player.dagstudio.ru/deploy-version.txt?v=$EXPECTED")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Production verification failed."
            echo "Expected commit: $EXPECTED"
            echo "Received marker: $ACTUAL"
            exit 1
          fi
          echo "Production verified at commit $EXPECTED"

          INDEX_HTML="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://player.dagstudio.ru/?v=$EXPECTED")"
          echo "$INDEX_HTML" | grep -q 'script.js?v=2216'

          MANIFEST_JSON="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://player.dagstudio.ru/manifest.json?v=$EXPECTED")"
          echo "$MANIFEST_JSON" | python -m json.tool > /dev/null
          echo "Live PWA shell and manifest verified"

          CHECK_AUTH="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"check_auth"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "CHECK_AUTH=$CHECK_AUTH"
          echo "$CHECK_AUTH" | python -c 'import sys,json; d=json.load(sys.stdin); assert "logged_in" in d'

          REG_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"register","name":"ab","pass":"1"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "REG_INVALID=$REG_INVALID"
          echo "$REG_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "не менее 3" in d.get("error","")'

          LOGIN_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"login","name":"__dagstudio_smoke_invalid__","pass":"__invalid__"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "LOGIN_INVALID=$LOGIN_INVALID"
          echo "$LOGIN_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "Неверный логин или пароль" in d.get("error","")'

          echo "Live auth API smoke checks passed"

      - name: Deployment is not configured yet
        if: ${{ env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '' || env.FTP_SERVER_DIR == '' }}
        run: |
          echo "FTP deployment is prepared but disabled until repository secrets are added."
          echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR."
