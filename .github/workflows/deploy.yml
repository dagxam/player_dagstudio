name: Deploy pl.dagstudio.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl-dagstudio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Document root поддомена на текущем хостинге.
      FTP_SERVER_DIR: /www/pl.dagstudio.ru/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          for file in ./*.php; do php -l "$file"; done
          node --check script.js
          node --check studio.js
          node --check sw.js
          node .github/test-offline-batch.mjs
          node .github/test-ios-preparation.mjs
          node .github/test-native-media.mjs
          test -s modern.css
          test -s studio.css
          python -m json.tool manifest.json > /dev/null

      - name: Local auth and playlist integration test
        run: |
          set -e
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions
          php -S 127.0.0.1:8765 >/tmp/dag-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill $PHP_PID 2>/dev/null || true; rm -f player.db player.db-*; rm -rf sessions' EXIT
          sleep 1

          USER="smoke_$GITHUB_RUN_ID"
          PASS="SmokePass_$GITHUB_RUN_ID"

          REGISTER="$(curl --fail --silent --show-error -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"register\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$REGISTER" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True and d.get("username") and d.get("session_token")'
          NATIVE_SESSION="$(echo "$REGISTER" | python -c 'import sys,json; print(json.load(sys.stdin)["session_token"])')"

          AUTH_NATIVE="$(curl --fail --silent --show-error -H "X-DAG-Session: $NATIVE_SESSION" -H 'Content-Type: application/json' --data '{"action":"check_auth"}' http://127.0.0.1:8765/api.php)"
          echo "$AUTH_NATIVE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("logged_in") is True'

          AUTH1="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"check_auth"}' http://127.0.0.1:8765/api.php)"
          echo "$AUTH1" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("logged_in") is True'

          CREATE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"create_playlist","name":"Smoke Playlist","type":"standard"}' http://127.0.0.1:8765/api.php)"
          PL_ID="$(echo "$CREATE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True; print(d["id"])')"

          ADD="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"add_track\",\"playlist_id\":$PL_ID,\"track\":{\"title\":\"Smoke Track\",\"artist\":\"DAGSTUDIO\",\"url\":\"https://example.com/smoke.mp3\",\"thumb\":\"\",\"type\":\"audio\"}}" http://127.0.0.1:8765/api.php)"
          echo "$ADD" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          TRACK_ID="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php | python -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["tracks"][0]["id"])')"
          REFRESH="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"update_track_url\",\"track_id\":$TRACK_ID,\"url\":\"https://api.audius.co/v1/tracks/test/stream\",\"thumb\":\"https://api.audius.co/test.jpg\"}" http://127.0.0.1:8765/api.php)"
          echo "$REFRESH" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          DATA="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php)"
          echo "$DATA" | python -c 'import sys,json; d=json.load(sys.stdin); assert len(d)==1 and d[0]["name"]=="Smoke Playlist" and len(d[0]["tracks"])==1 and d[0]["tracks"][0]["url"].startswith("https://api.audius.co/")'

          LOGOUT="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"logout"}' http://127.0.0.1:8765/api.php)"
          echo "$LOGOUT" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          LOGIN="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"login\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$LOGIN" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          echo "Local auth and playlist integration passed"
          kill $PHP_PID
          wait $PHP_PID 2>/dev/null || true
          trap - EXIT
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions

      - name: Create deployment marker
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          printf '%s' "$GITHUB_SHA" > deploy-version.txt
          printf '%s' "$GITHUB_SHA" > "deploy-$GITHUB_SHA.txt"

      - name: Deploy site over FTP
        id: ftp_primary
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            package.json
            package-lock.json
            capacitor.config.json
            NATIVE_APP.md
            scripts/**
            node_modules/**
            www/**
            android/**
            ios/**
            assets/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      - name: Retry FTP deploy after connection timeout
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' && steps.ftp_primary.outcome != 'success' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            package.json
            package-lock.json
            capacitor.config.json
            NATIVE_APP.md
            scripts/**
            node_modules/**
            www/**
            android/**
            ios/**
            assets/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      - name: Verify production version
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          EXPECTED="$GITHUB_SHA"

          UNIQUE_URL="https://pl.dagstudio.ru/deploy-$EXPECTED.txt"
          UNIQUE_ACTUAL="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$UNIQUE_URL" || true)"
          if [ "$UNIQUE_ACTUAL" != "$EXPECTED" ]; then
            echo "Unique production probe is not visible at pl.dagstudio.ru."
            echo "FTP upload succeeded, but the configured FTP_SERVER_DIR is not the active document root for pl.dagstudio.ru, or the hosting proxy is serving a different origin."
            echo "Expected commit: $EXPECTED"
            echo "Unique probe response: $UNIQUE_ACTUAL"
            exit 1
          fi

          ACTUAL="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://pl.dagstudio.ru/deploy-version.txt?v=$EXPECTED")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unique probe is current, but deploy-version.txt is cached. Continuing because the uncached unique probe verified the deployment."
          fi
          echo "Production verified at commit $EXPECTED"

          INDEX_HTML="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://pl.dagstudio.ru/?v=$EXPECTED")"
          echo "$INDEX_HTML" | grep -q 'script.js?v=2280'
          echo "$INDEX_HTML" | grep -q 'style.css?v=2227'
          echo "$INDEX_HTML" | grep -q 'modern.css?v=16'
          echo "$INDEX_HTML" | grep -q 'id="android-apk-download-btn"'
          echo "$INDEX_HTML" | grep -q 'id="app-update-btn"'
          echo "$INDEX_HTML" | grep -q 'id="app-version-footer"'
          if echo "$INDEX_HTML" | grep -q 'id="pwa-install-btn"'; then
            echo "Deprecated PWA install button is still present"
            exit 1
          fi

          MANIFEST_JSON="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://pl.dagstudio.ru/manifest.json?v=$EXPECTED")"
          echo "$MANIFEST_JSON" | python -m json.tool > /dev/null
          echo "Live PWA shell and manifest verified"

          CHECK_AUTH="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"check_auth"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "CHECK_AUTH=$CHECK_AUTH"
          echo "$CHECK_AUTH" | python -c 'import sys,json; d=json.load(sys.stdin); assert "logged_in" in d'

          REG_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"register","name":"ab","pass":"1"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "REG_INVALID=$REG_INVALID"
          echo "$REG_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "не менее 3" in d.get("error","")'

          LOGIN_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"login","name":"__dagstudio_smoke_invalid__","pass":"__invalid__"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "LOGIN_INVALID=$LOGIN_INVALID"
          echo "$LOGIN_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "Неверный логин или пароль" in d.get("error","")'

          echo "Live auth API smoke checks passed"

          SEARCH_JSON="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 40 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"search_global","query":"Coldplay","page":1}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          AUDIO_INFO="$(printf '%s' "$SEARCH_JSON" | python -c 'import sys,json,urllib.parse; d=json.load(sys.stdin); allowed=("api.audius.co","slider.kz","ru.hitmoz.org","hitmoz.org","muzofond.fm","zvooq.net","muzvox.org","storage.muzvox.org","static.muzvox.org","muzca.net"); items=d.get("data",[]); x=next((i for i in items if i.get("url") and (urllib.parse.urlparse(i["url"]).hostname or "").lower().endswith(allowed)), None); assert x, "No playable whitelisted search result"; print(x["url"]+"\t"+str(x.get("source","")))')"
          AUDIO_URL="$(printf '%s' "$AUDIO_INFO" | cut -f1)"
          AUDIO_SOURCE="$(printf '%s' "$AUDIO_INFO" | cut -f2 | tr -cd '[:alnum:]_')"
          ENCODED_URL="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$AUDIO_URL")"

          rm -f /tmp/dag-audio.bin /tmp/dag-audio.headers
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 40 --range 0-2047 -D /tmp/dag-audio.headers -o /tmp/dag-audio.bin "https://pl.dagstudio.ru/proxy.php?url=$ENCODED_URL&source=$AUDIO_SOURCE&retry=0"
          test -s /tmp/dag-audio.bin
          grep -Eiq '^content-type: audio/' /tmp/dag-audio.headers

          RANGE_STATUS="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/dag-audio.headers)"
          if [ "$RANGE_STATUS" = "206" ]; then
            grep -Eiq '^content-range: bytes [0-9]+-[0-9]+/([0-9]+|\*)' /tmp/dag-audio.headers
            grep -Eiq '^x-dag-range-mode: partial' /tmp/dag-audio.headers
          elif [ "$RANGE_STATUS" = "200" ]; then
            grep -Eiq '^x-dag-range-mode: full' /tmp/dag-audio.headers
          else
            echo "Unexpected audio proxy status: $RANGE_STATUS"
            cat /tmp/dag-audio.headers
            exit 1
          fi
          echo "Live search + strict audio Range smoke check passed"

      - name: Deployment is not configured yet
        if: ${{ env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '' || env.FTP_SERVER_DIR == '' }}
        run: |
          echo "FTP deployment is prepared but disabled until repository secrets are added."
          echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and FTP_SERVER_DIR."
