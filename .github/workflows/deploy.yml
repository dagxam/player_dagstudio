name: Deploy player.dagstudio.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-dagstudio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          for file in ./*.php; do php -l "$file"; done
          node --check script.js
          node --check sw.js
          python -m json.tool manifest.json > /dev/null

      - name: Local auth and playlist integration test
        run: |
          set -e
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions
          php -S 127.0.0.1:8765 >/tmp/dag-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill $PHP_PID 2>/dev/null || true; rm -f player.db player.db-*; rm -rf sessions' EXIT
          sleep 1

          USER="smoke_$GITHUB_RUN_ID"
          PASS="SmokePass_$GITHUB_RUN_ID"

          REGISTER="$(curl --fail --silent --show-error -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"register\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$REGISTER" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True and d.get("username")'

          AUTH1="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"check_auth"}' http://127.0.0.1:8765/api.php)"
          echo "$AUTH1" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("logged_in") is True'

          CREATE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"create_playlist","name":"Smoke Playlist","type":"standard"}' http://127.0.0.1:8765/api.php)"
          PL_ID="$(echo "$CREATE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True; print(d["id"])')"

          ADD="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"add_track\",\"playlist_id\":$PL_ID,\"track\":{\"title\":\"Smoke Track\",\"artist\":\"DAGSTUDIO\",\"url\":\"https://example.com/smoke.mp3\",\"thumb\":\"\",\"type\":\"audio\"}}" http://127.0.0.1:8765/api.php)"
          echo "$ADD" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          DATA="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php)"
          echo "$DATA" | python -c 'import sys,json; d=json.load(sys.stdin); assert len(d)==1 and d[0]["name"]=="Smoke Playlist" and len(d[0]["tracks"])==1'

          LOGOUT="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"logout"}' http://127.0.0.1:8765/api.php)"
          echo "$LOGOUT" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          LOGIN="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"login\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$LOGIN" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          echo "Local auth and playlist integration passed"
          kill $PHP_PID
          wait $PHP_PID 2>/dev/null || true
          trap - EXIT
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions

      - name: Create deployment marker
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: printf '%s' "$GITHUB_SHA" > deploy-version.txt

      - name: Deploy site over FTP
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      - name: Verify production version
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          EXPECTED="$GITHUB_SHA"
          ACTUAL="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://player.dagstudio.ru/deploy-version.txt?v=$EXPECTED")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Production verification failed."
            echo "Expected commit: $EXPECTED"
            echo "Received marker: $ACTUAL"
            exit 1
          fi
          echo "Production verified at commit $EXPECTED"

          INDEX_HTML="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://player.dagstudio.ru/?v=$EXPECTED")"
          echo "$INDEX_HTML" | grep -q 'script.js?v=2216'

          MANIFEST_JSON="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://player.dagstudio.ru/manifest.json?v=$EXPECTED")"
          echo "$MANIFEST_JSON" | python -m json.tool > /dev/null
          echo "Live PWA shell and manifest verified"

          CHECK_AUTH="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"check_auth"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "CHECK_AUTH=$CHECK_AUTH"
          echo "$CHECK_AUTH" | python -c 'import sys,json; d=json.load(sys.stdin); assert "logged_in" in d'

          REG_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"register","name":"ab","pass":"1"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "REG_INVALID=$REG_INVALID"
          echo "$REG_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "не менее 3" in d.get("error","")'

          LOGIN_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"login","name":"__dagstudio_smoke_invalid__","pass":"__invalid__"}' "https://player.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "LOGIN_INVALID=$LOGIN_INVALID"
          echo "$LOGIN_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "Неверный логин или пароль" in d.get("error","")'

          echo "Live auth API smoke checks passed"

      - name: Deployment is not configured yet
        if: ${{ env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '' || env.FTP_SERVER_DIR == '' }}
        run: |
          echo "FTP deployment is prepared but disabled until repository secrets are added."
          echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR."
