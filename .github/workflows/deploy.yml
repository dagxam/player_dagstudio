name: Deploy pl.dagstudio.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl-dagstudio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Document root поддомена на текущем хостинге.
      FTP_SERVER_DIR: /www/pl.dagstudio.ru/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          for file in ./*.php; do php -l "$file"; done
          node --check script.js
          node --check studio.js
          node --check studio-next.js
          node --check studio-center.js
          node --check studio-vision.js
          node --check sw.js
          node .github/test-cc3-offline-failover.mjs
          node .github/test-ota-update.mjs
          node .github/test-connectivity.mjs
          node .github/test-end-to-end-network.mjs
          node .github/test-profile-theme.mjs
          node .github/test-native-http-fallback.mjs
          node .github/test-trusted-ip-dns.mjs
          node .github/test-in-app-apk-update.mjs
          node .github/test-fast-start.mjs
          node .github/test-weak-network.mjs
          node .github/test-favorite-hearts.mjs
          node .github/test-playlist-navigation.mjs
          node .github/test-rainbow-offline.mjs
          node .github/test-fast-search-wave.mjs
          node .github/test-vision-ui.mjs
          node .github/test-search-history-ui.mjs
          node .github/test-collapsed-collections.mjs
          node .github/test-playlist-visual.mjs
          node .github/test-update-notifications.mjs
          node .github/test-hitmos-provider.mjs
          node .github/test-listen-cache.mjs
          node .github/test-local-icons.mjs
          node .github/test-source-health.mjs
          node .github/test-caucasus-catalogs.mjs
          node .github/test-official-music.mjs
          node --check scripts/configure-android-media.mjs
          php -l ota-bridge.php
          node .github/test-offline-batch.mjs
          node .github/test-ios-preparation.mjs
          node .github/test-native-media.mjs
          node .github/test-quick-mixes.mjs
          node .github/test-fresh-mixes.mjs
          node .github/test-personal-radio.mjs
          node .github/test-wave-themes.mjs
          node .github/test-continuous-radio.mjs
          node .github/test-playlist-covers.mjs
          test -s modern.css
          test -s studio.css
          test -s studio-next.css
          test -s studio-touch.css
          test -s studio-center.js
          test -s studio-vision.css
          test -s studio-vision.js
          python -m json.tool manifest.json > /dev/null

      - name: Verify shared web and Android UI before FTP publication
        run: |
          npm install --no-audit --no-fund
          npm run native:web
          node .github/test-web-apk-parity.mjs

      - name: Test favorite toggle via real PHP and SQLite
        run: node .github/test-favorite-api.mjs

      - name: Local auth and playlist integration test
        run: |
          set -e
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions
          php -S 127.0.0.1:8765 >/tmp/dag-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill $PHP_PID 2>/dev/null || true; rm -f player.db player.db-*; rm -rf sessions' EXIT
          sleep 1

          USER="smoke_$GITHUB_RUN_ID"
          PASS="SmokePass_$GITHUB_RUN_ID"

          REGISTER="$(curl --fail --silent --show-error -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"register\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$REGISTER" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True and d.get("username") and d.get("session_token")'
          NATIVE_SESSION="$(echo "$REGISTER" | python -c 'import sys,json; print(json.load(sys.stdin)["session_token"])')"

          AUTH_NATIVE="$(curl --fail --silent --show-error -H "X-DAG-Session: $NATIVE_SESSION" -H 'Content-Type: application/json' --data '{"action":"check_auth"}' http://127.0.0.1:8765/api.php)"
          echo "$AUTH_NATIVE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("logged_in") is True'

          AUTH1="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"check_auth"}' http://127.0.0.1:8765/api.php)"
          echo "$AUTH1" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("logged_in") is True'

          CREATE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"create_playlist","name":"Smoke Playlist","type":"standard"}' http://127.0.0.1:8765/api.php)"
          PL_ID="$(echo "$CREATE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True; print(d["id"])')"

          # Icon survives account reload and rejects unknown symbols.
          ICON_SAVE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"update_playlist_icon\",\"id\":$PL_ID,\"icon\":\"mountain\"}" http://127.0.0.1:8765/api.php)"
          echo "$ICON_SAVE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True and d.get("icon")=="mountain"'
          ICON_INVALID="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"update_playlist_icon\",\"id\":$PL_ID,\"icon\":\"<script>\"}" http://127.0.0.1:8765/api.php)"
          echo "$ICON_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("error") and not d.get("success")'
          ICON_DATA="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php)"
          echo "$ICON_DATA" | python -c 'import sys,json; d=json.load(sys.stdin); assert d[0]["icon"]=="mountain"'

          # Upload a real 24px PNG, reload the playlist, and remove its file.
          python -c 'import json,base64,struct,zlib,sys; w=h=24; chunk=lambda k,d: struct.pack(">I",len(d))+k+d+struct.pack(">I",zlib.crc32(k+d)); png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))+chunk(b"IDAT",zlib.compress((b"\0"+b"\x80\x40\x20"*w)*h))+chunk(b"IEND",b""); json.dump({"action":"update_playlist_cover","id":int(sys.argv[1]),"image":"data:image/png;base64,"+base64.b64encode(png).decode()},open("/tmp/dag-cover-payload.json","w"))' "$PL_ID"
          COVER_SAVE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data-binary @/tmp/dag-cover-payload.json http://127.0.0.1:8765/api.php)"
          COVER_PATH="$(echo "$COVER_SAVE" | python -c 'import json,sys,re; d=json.load(sys.stdin); assert d.get("success") is True; assert re.fullmatch(r"images/playlist-covers/[a-f0-9]{32}\.png",d["cover"]); print(d["cover"])')"
          test -s "$COVER_PATH"
          COVER_DATA="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php)"
          echo "$COVER_DATA" | python -c 'import json,sys; d=json.load(sys.stdin); assert d[0]["cover"].startswith("images/playlist-covers/")'
          COVER_REMOVE="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"update_playlist_cover\",\"id\":$PL_ID,\"remove\":true}" http://127.0.0.1:8765/api.php)"
          echo "$COVER_REMOVE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True and d.get("cover")==""'
          test ! -e "$COVER_PATH"
          rm -f /tmp/dag-cover-payload.json

          ADD="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"add_track\",\"playlist_id\":$PL_ID,\"track\":{\"title\":\"Smoke Track\",\"artist\":\"DAGSTUDIO\",\"url\":\"https://example.com/smoke.mp3\",\"thumb\":\"\",\"type\":\"audio\"}}" http://127.0.0.1:8765/api.php)"
          echo "$ADD" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          TRACK_ID="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php | python -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["tracks"][0]["id"])')"
          REFRESH="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"update_track_url\",\"track_id\":$TRACK_ID,\"url\":\"https://api.audius.co/v1/tracks/test/stream\",\"thumb\":\"https://api.audius.co/test.jpg\"}" http://127.0.0.1:8765/api.php)"
          echo "$REFRESH" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          DATA="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"get_data"}' http://127.0.0.1:8765/api.php)"
          echo "$DATA" | python -c 'import sys,json; d=json.load(sys.stdin); assert len(d)==1 and d[0]["name"]=="Smoke Playlist" and len(d[0]["tracks"])==1 and d[0]["tracks"][0]["url"].startswith("https://api.audius.co/")'

          LOGOUT="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data '{"action":"logout"}' http://127.0.0.1:8765/api.php)"
          echo "$LOGOUT" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          LOGIN="$(curl --fail --silent --show-error -b /tmp/dag-cookie.txt -c /tmp/dag-cookie.txt -H 'Content-Type: application/json' --data "{\"action\":\"login\",\"name\":\"$USER\",\"pass\":\"$PASS\"}" http://127.0.0.1:8765/api.php)"
          echo "$LOGIN" | python -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success") is True'

          echo "Local auth and playlist integration passed"
          kill $PHP_PID
          wait $PHP_PID 2>/dev/null || true
          trap - EXIT
          rm -f player.db player.db-* /tmp/dag-cookie.txt
          rm -rf sessions

      - name: Create deployment marker
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          printf '%s' "$GITHUB_SHA" > deploy-version.txt
          printf '%s' "$GITHUB_SHA" > "deploy-$GITHUB_SHA.txt"
          # The HTML records which exact commit was loaded, while the public
          # marker changes on every successful deployment. This makes update
          # prompts accurate even for non-JavaScript changes.
          python - <<'PY'
          from pathlib import Path
          import os,re
          file = Path('index.php')
          html = file.read_text(encoding='utf-8')
          token = 'content="__DAG_BUILD_COMMIT__"'
          assert html.count(token) == 1, 'Missing deployment build identity'
          commit = os.environ['GITHUB_SHA']
          html = html.replace(token, 'content="' + commit + '"')
          # Give each successful website commit unique local CSS/JS URLs so
          # an old service worker cannot load old UI files after "Обновить".
          pattern = r'((?:src|href)="(?:script\.js|studio(?:-next|-center|-vision)?\.js|(?:style|modern|studio|studio-next|studio-touch|studio-vision)\.css)\?v=\d+)(?=")'
          html, count = re.subn(pattern, lambda m: m.group(1) + '-' + commit[:12], html)
          assert count >= 9, 'Revisioned CSS/JS assets are missing'
          file.write_text(html, encoding='utf-8')
          PY

      - name: Deploy site over FTP
        id: ftp_primary
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            package.json
            package-lock.json
            capacitor.config.json
            NATIVE_APP.md
            scripts/**
            node_modules/**
            www/**
            android/**
            ios/**
            assets/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      - name: Retry FTP deploy after connection timeout
        id: ftp_retry
        continue-on-error: true
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' && steps.ftp_primary.outcome != 'success' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            package.json
            package-lock.json
            capacitor.config.json
            NATIVE_APP.md
            scripts/**
            node_modules/**
            www/**
            android/**
            ios/**
            assets/**
            player.db
            player.db-*
            sessions/**
            uploads/**
            cache/**
            *.log

      # Some shared-hosting FTP servers stop responding during the Action's
      # LIST/replace operation. Upload the release-critical files separately
      # and finish with the unique marker, so production verification can still
      # fail safely if the site is actually unreachable.
      - name: Rescue critical web files when FTP actions time out
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' && steps.ftp_primary.outcome != 'success' && steps.ftp_retry.outcome != 'success' }}
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import ssl
          import time

          host=os.environ['FTP_SERVER']
          username=os.environ['FTP_USERNAME']
          password=os.environ['FTP_PASSWORD']
          destination=os.environ['FTP_SERVER_DIR']
          protocol=os.environ.get('FTP_PROTOCOL','ftp').lower()
          port=int(os.environ.get('FTP_PORT') or 21)
          version=os.environ['GITHUB_SHA']
          essential=['script.js','sw.js','index.php','deploy-version.txt',
                     'deploy-'+version+'.txt']
          if protocol not in ('ftp','ftps'):
              raise SystemExit('FTP fallback supports ftp and explicit ftps only')

          def connect():
              ftp=(ftplib.FTP_TLS(context=ssl.create_default_context())
                   if protocol=='ftps' else ftplib.FTP())
              ftp.connect(host,port,timeout=25)
              ftp.login(username,password)
              if protocol=='ftps':
                  ftp.prot_p()
              ftp.set_pasv(True)
              ftp.cwd(destination)
              return ftp

          def upload(ftp,name):
              staged=name+'.upload-'+version[:12]
              with open(name,'rb') as fh:
                  ftp.storbinary('STOR '+staged,fh,blocksize=32768)
              try:
                  ftp.rename(staged,name)
              except ftplib.error_perm:
                  # Some FTP hosts prohibit renaming onto existing paths.
                  # The original file remains intact until the staging write
                  # completed; only then use the server's normal replace path.
                  with open(name,'rb') as fh:
                      ftp.storbinary('STOR '+name,fh,blocksize=32768)
                  try:
                      ftp.delete(staged)
                  except ftplib.all_errors:
                      pass

          last_error=None
          for attempt in range(1,4):
              ftp=None
              try:
                  print('Critical FTP recovery attempt',attempt,flush=True)
                  ftp=connect()
                  for name in essential:
                      upload(ftp,name)
                      print('Transferred',name,flush=True)
                  ftp.quit()
                  print('Critical FTP recovery complete; verify production next.')
                  break
              except ftplib.all_errors as error:
                  last_error=error
                  print('Critical FTP recovery failed:',str(error)[:180],flush=True)
                  try:
                      if ftp:
                          ftp.close()
                  except OSError:
                      pass
                  if attempt==3:
                      raise SystemExit('FTP host did not accept a complete critical release')
                  time.sleep(4)
          PY

      - name: Verify production version
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          EXPECTED="$GITHUB_SHA"

          UNIQUE_URL="https://pl.dagstudio.ru/deploy-$EXPECTED.txt"
          UNIQUE_ACTUAL="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$UNIQUE_URL" || true)"
          if [ "$UNIQUE_ACTUAL" != "$EXPECTED" ]; then
            echo "Unique production probe is not visible at pl.dagstudio.ru."
            echo "FTP upload succeeded, but the configured FTP_SERVER_DIR is not the active document root for pl.dagstudio.ru, or the hosting proxy is serving a different origin."
            echo "Expected commit: $EXPECTED"
            echo "Unique probe response: $UNIQUE_ACTUAL"
            exit 1
          fi

          ACTUAL="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://pl.dagstudio.ru/deploy-version.txt?v=$EXPECTED")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unique probe is current, but deploy-version.txt is cached. Continuing because the uncached unique probe verified the deployment."
          fi
          echo "Production verified at commit $EXPECTED"

          INDEX_HTML="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://pl.dagstudio.ru/?v=$EXPECTED")"
          EXPECTED_SCRIPT="$(sed -n 's/.*src="\(script\.js?v=[^"]*\)".*/\1/p' index.php | head -n 1)"
          echo "Website HTML received: ${#INDEX_HTML} bytes; expected JS: ${EXPECTED_SCRIPT:-missing}"
          test -n "$EXPECTED_SCRIPT"
          if ! grep -Fq "$EXPECTED_SCRIPT" <<< "$INDEX_HTML"; then
            echo "Deployed HTML does not reference expected script: $EXPECTED_SCRIPT"
            echo "Live script references:"
            grep -oE 'script\.js\?v=[a-zA-Z0-9._-]+' <<< "$INDEX_HTML" | head -n 5 || true
            exit 1
          fi
          EXPECTED_STYLE="$(sed -n 's/.*href="\(style\.css?v=[^"]*\)".*/\1/p' index.php | head -n 1)"
          echo "Expected CSS: ${EXPECTED_STYLE:-missing}"
          test -n "$EXPECTED_STYLE"
          if ! grep -Fq "$EXPECTED_STYLE" <<< "$INDEX_HTML"; then
            echo "Deployed HTML does not reference expected stylesheet"
            grep -oE 'style\.css\?v=[a-zA-Z0-9._-]+' <<< "$INDEX_HTML" | head -n 5 || true
            exit 1
          fi
          grep -q 'modern.css?v=16' <<< "$INDEX_HTML"
          grep -q 'id="android-apk-download-btn"' <<< "$INDEX_HTML"
          grep -q 'id="app-update-btn"' <<< "$INDEX_HTML"
          grep -q 'id="app-version-footer"' <<< "$INDEX_HTML"
          EXPECTED_VISION_STYLE="$(grep -oE 'studio-vision[.]css[?]v=[[:alnum:]_.-]+' index.php | head -n 1)"
          EXPECTED_VISION_SCRIPT="$(grep -oE 'studio-vision[.]js[?]v=[[:alnum:]_.-]+' index.php | head -n 1)"
          test -n "$EXPECTED_VISION_STYLE"
          test -n "$EXPECTED_VISION_SCRIPT"
          grep -Fq "$EXPECTED_VISION_STYLE" <<< "$INDEX_HTML"
          grep -Fq "$EXPECTED_VISION_SCRIPT" <<< "$INDEX_HTML"
          for asset in studio-vision.css studio-vision.js images/vision-hero.svg; do
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 25 \
              "https://pl.dagstudio.ru/$asset?v=$EXPECTED" \
              -o "/tmp/dag-$(basename "$asset")"
            test -s "/tmp/dag-$(basename "$asset")"
          done
          grep -q 'DAGSTUDIO VISION' /tmp/dag-studio-vision.css
          grep -q 'vision-home-hero' /tmp/dag-studio-vision.js
          if grep -q 'id="pwa-install-btn"' <<< "$INDEX_HTML"; then
            echo "Deprecated PWA install button is still present"
            exit 1
          fi

          MANIFEST_JSON="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://pl.dagstudio.ru/manifest.json?v=$EXPECTED")"
          echo "$MANIFEST_JSON" | python -m json.tool > /dev/null
          echo "Live PWA shell and manifest verified"
          for font in solid-900 regular-400 brands-400; do
            curl --fail --silent --show-error --location --max-time 20 \
              "https://pl.dagstudio.ru/vendor/fontawesome/webfonts/fa-$font.woff2" \
              -o "/tmp/dag-font-$font.woff2"
            test "$(wc -c < "/tmp/dag-font-$font.woff2")" -gt 10000
          done
          curl --fail --silent --show-error --location --max-time 20 \
            "https://pl.dagstudio.ru/vendor/fontawesome/css/all.min.css?v=6722" \
            -o /tmp/dag-fontawesome.css
          grep -q 'Font Awesome Free 6.7.2' /tmp/dag-fontawesome.css
          echo "Local icon fonts available without CDN"

          CHECK_AUTH="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"check_auth"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "CHECK_AUTH=$CHECK_AUTH"
          echo "$CHECK_AUTH" | python -c 'import sys,json; d=json.load(sys.stdin); assert "logged_in" in d'

          REG_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"register","name":"ab","pass":"1"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "REG_INVALID=$REG_INVALID"
          echo "$REG_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "не менее 3" in d.get("error","")'

          LOGIN_INVALID="$(curl --fail --silent --show-error --location --max-time 20 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"login","name":"__dagstudio_smoke_invalid__","pass":"__invalid__"}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          echo "LOGIN_INVALID=$LOGIN_INVALID"
          echo "$LOGIN_INVALID" | python -c 'import sys,json; d=json.load(sys.stdin); assert "Неверный логин или пароль" in d.get("error","")'

          echo "Live auth API smoke checks passed"

          SEARCH_JSON="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 40 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"search_global","query":"Coldplay","page":1}' "https://pl.dagstudio.ru/api.php?t=$EXPECTED")"
          AUDIO_INFO="$(printf '%s' "$SEARCH_JSON" | python -c 'import sys,json,urllib.parse; d=json.load(sys.stdin); allowed=("api.audius.co","slider.kz","ru.hitmoz.org","hitmoz.org","muzofond.fm","zvooq.net","muzvox.org","storage.muzvox.org","static.muzvox.org","muzca.net"); items=d.get("data",[]); x=next((i for i in items if i.get("url") and (urllib.parse.urlparse(i["url"]).hostname or "").lower().endswith(allowed)), None); assert x, "No playable whitelisted search result"; print(x["url"]+"\t"+str(x.get("source","")))')"
          AUDIO_URL="$(printf '%s' "$AUDIO_INFO" | cut -f1)"
          AUDIO_SOURCE="$(printf '%s' "$AUDIO_INFO" | cut -f2 | tr -cd '[:alnum:]_')"
          ENCODED_URL="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$AUDIO_URL")"

          rm -f /tmp/dag-audio.bin /tmp/dag-audio.headers
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 40 --range 0-2047 -D /tmp/dag-audio.headers -o /tmp/dag-audio.bin "https://pl.dagstudio.ru/proxy.php?url=$ENCODED_URL&source=$AUDIO_SOURCE&retry=0"
          test -s /tmp/dag-audio.bin
          grep -Eiq '^content-type: audio/' /tmp/dag-audio.headers

          RANGE_STATUS="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/dag-audio.headers)"
          if [ "$RANGE_STATUS" = "206" ]; then
            grep -Eiq '^content-range: bytes [0-9]+-[0-9]+/([0-9]+|\*)' /tmp/dag-audio.headers
            grep -Eiq '^x-dag-range-mode: partial' /tmp/dag-audio.headers
          elif [ "$RANGE_STATUS" = "200" ]; then
            grep -Eiq '^x-dag-range-mode: full' /tmp/dag-audio.headers
          else
            echo "Unexpected audio proxy status: $RANGE_STATUS"
            cat /tmp/dag-audio.headers
            exit 1
          fi
          echo "Live search + strict audio Range smoke check passed"

      - name: Deployment is not configured yet
        if: ${{ env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '' || env.FTP_SERVER_DIR == '' }}
        run: |
          echo "FTP deployment is prepared but disabled until repository secrets are added."
          echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and FTP_SERVER_DIR."
          exit 1 # A green CI run must never imply deployment without FTP credentials.

      - name: Verify APK download link serves a real attachment
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != '' }}
        run: |
          set -e
          curl --fail --silent --show-error --location --head --retry 3 --retry-delay 3 --max-time 45 \
            "https://pl.dagstudio.ru/apk-download.php?check=$GITHUB_SHA" -o /tmp/dag-apk-download-headers.txt
          grep -qi '^content-disposition: attachment; filename="DAGSTUDIO-PLAYER-Preview.apk"' /tmp/dag-apk-download-headers.txt
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/dag-apk-download-headers.txt
          BYTES="$(awk 'tolower($1)=="content-length:" {gsub("\r","",$2); print $2}' /tmp/dag-apk-download-headers.txt | tail -n 1)"
          test "${BYTES:-0}" -gt 1000000
          echo "APK_ATTACHMENT_DOWNLOAD_VERIFIED bytes=$BYTES"
