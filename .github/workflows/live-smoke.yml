name: Live player smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-smoke.yml"
      - ".github/live-smoke.mjs"
      - "index.php"
      - "script.js"
      - "style.css"
      - "api.php"
      - "proxy.php"
      - "manifest.json"
      - "sw.js"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Chrome
        run: |
          set -e
          which google-chrome || which chromium || which chromium-browser
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Wait for this commit on production
        run: |
          set -e
          EXPECTED="$GITHUB_SHA"
          for attempt in $(seq 1 36); do
            ACTUAL="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://pl.dagstudio.ru/deploy-$EXPECTED.txt" || true)"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Production is ready at $EXPECTED"
              exit 0
            fi
            echo "Waiting for production deploy ($attempt/36)..."
            sleep 5
          done
          echo "Production did not reach commit $EXPECTED"
          exit 1

      - name: Run live browser smoke test
        env:
          PLAYER_URL: https://pl.dagstudio.ru/
        run: node .github/live-smoke.mjs
