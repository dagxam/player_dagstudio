name: Music Source Health

on:
  push:
    branches:
      - main
    paths:
      - "api.php"
      - "proxy.php"
      - "music-official.php"
      - ".github/workflows/music-sources-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: read

jobs:
  sources:
    name: Check all music sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l api.php
          php -l proxy.php
          php -l music-official.php
          node .github/test-official-music.mjs

      - name: Start local player API
        run: |
          rm -f player.db player.db-*
          rm -rf sessions
          php -S 127.0.0.1:8765 >/tmp/dag-source-health.log 2>&1 &
          echo $! > /tmp/dag-source-health.pid
          sleep 1

      - name: Query all providers in weak-network mode
        run: |
          set -e
          RESULT="$(curl --fail --silent --show-error --max-time 20             -H 'Content-Type: application/json'             --data '{"action":"search_global","query":"Miyagi","page":1,"network":"weak","save_data":1}'             http://127.0.0.1:8765/api.php)"

          printf '%s' "$RESULT" > /tmp/source-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/source-health.json').read_text())
          expected = ['audius','vk_mail','hitmoz','muzo','zvooq','muzvox','muzca','jamendo']

          assert data.get('success') is True, data
          sources = data.get('sources') or {}
          counts = data.get('source_counts') or {}
          missing = [name for name in expected if name not in sources]
          assert not missing, f"Missing source diagnostics: {missing}"

          print("NETWORK_MODE", data.get("network_mode"))
          print("RESULT_COUNT", len(data.get("data") or []))
          for name in expected:
              info = sources.get(name) or {}
              print(
                  "SOURCE",
                  name,
                  "ok="+str(bool(info.get("ok"))).lower(),
                  "http="+str(info.get("http", 0)),
                  "count="+str(counts.get({
                      'audius':'[AUDIUS]',
                      'vk_mail':'[VK]',
                      'hitmoz':'[HITMOZ]',
                      'muzo':'[MUZOFOND]',
                      'zvooq':'[ZVOOQ]',
                      'muzvox':'[MUZVOX]',
                      'muzca':'[MUZCA]', 'jamendo':'[JAMENDO]'
                  }[name], 0)),
                  "error="+str(info.get("error",""))[:100]
              )

          if not data.get('data'):
              raise SystemExit("No music provider returned a playable search result")
          PY

      - name: Check production player API and OTA endpoint
        run: |
          set -euo pipefail
          echo "DNS addresses (runner):"
          getent ahostsv4 pl.dagstudio.ru | head -n 3
          curl --fail --silent --show-error --retry 2 --max-time 40 \
            -H 'Content-Type: application/json' \
            --data '{"action":"search_global","query":"Miyagi","page":1,"network":"weak"}' \
            https://pl.dagstudio.ru/api.php -o /tmp/dag-public-search.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dag-public-search.json'))
          items=data.get('data') or []
          print('LIVE_SEARCH_COUNT',len(items))
          counts=data.get('source_counts') or {}
          names={'audius':'[AUDIUS]','vk_mail':'[VK]','hitmoz':'[HITMOZ]',
                 'muzo':'[MUZOFOND]','zvooq':'[ZVOOQ]',
                 'muzvox':'[MUZVOX]','muzca':'[MUZCA]',
                 'jamendo':'[JAMENDO]'}
          for k,v in (data.get('sources') or {}).items():
              print('LIVE_SOURCE',k,'ok='+str(bool(v.get('ok'))).lower(),
                    'http='+str(v.get('http',0)),
                    'matching_tracks='+str(counts.get(names.get(k,''),0)),
                    'audio_verified=false')
          assert data.get('success') is True and len(items)>0, 'Live API search unavailable'
          PY
          curl --fail --silent --show-error --retry 2 --max-time 35 \
            https://pl.dagstudio.ru/ota/DAGSTUDIO-PLAYER-web-version.json -o /tmp/dag-public-ota.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dag-public-ota.json'))
          assert data.get('version') and data.get('checksum') and data.get('url')
          print('LIVE_OTA_VERSION',data['version'])
          PY


      - name: Probe representative audio per source on production
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures,json,urllib.request,urllib.parse
          data=json.load(open('/tmp/dag-public-search.json'))
          groups={}
          for item in data.get('data',[]):
              tag=str(item.get('source','')).upper()
              if item.get('url') and tag and tag not in groups:
                  groups[tag]=item
          labels=['[AUDIUS]','[VK]','[HITMOZ]','[MUZOFOND]','[ZVOOQ]','[MUZVOX]','[MUZCA]','[JAMENDO]']
          def probe(label):
              t=groups.get(label)
              if not t:return (label,'NO_MATCHING_SEARCH_RESULT')
              url='https://pl.dagstudio.ru/proxy.php?'+urllib.parse.urlencode({
                  'url':t['url'],'source':label.strip('[]').lower(),'weak':'1'})
              req=urllib.request.Request(url,method='HEAD',
                  headers={'User-Agent':'DAGSTUDIO-PLAYER-source-health/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      mime=r.headers.get('content-type','')
                      return (label,'AUDIO_HEAD_OK' if r.status in (200,206) and mime.startswith('audio/') else 'BAD_RESPONSE',
                          r.status,mime[:50])
              except Exception as err:return (label,'AUDIO_HEAD_FAILED',str(err)[:120])
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              statuses=list(ex.map(probe,labels))
          for item in statuses:print('LIVE_SOURCE_AUDIO',*item)
          if not any(row[1]=='AUDIO_HEAD_OK' for row in statuses):
              print('WARNING: No sample audio URL passed HEAD; investigate provider/server connectivity')
          PY

      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/dag-source-health.pid ]; then
            kill "$(cat /tmp/dag-source-health.pid)" 2>/dev/null || true
          fi
          rm -f player.db player.db-*
          rm -rf sessions
