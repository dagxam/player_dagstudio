name: Music Source Health

on:
  push:
    branches: [main]
    paths:
      - "api.php"
      - "proxy.php"
      - "script.js"
      - ".github/test-two-search-sources.mjs"
      - ".github/workflows/music-sources-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: read

jobs:
  sources:
    name: Verify Muzofond and Hitmoz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify only two active search providers
        run: |
          php -l api.php
          php -l proxy.php
          node --check script.js
          node .github/test-two-search-sources.mjs

      - name: Probe candidate Hitmos site and search markup
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re
          q=urllib.parse.quote('Miyagi')
          tests=[
              'https://ru.hitmos.site/',
              'https://ru.hitmos.site/search?q='+q,
              'https://ru.hitmos.site/search/'+q,
              'https://ru.hitmos.site/?do=search&subaction=search&story='+q,
              'https://ru.hitmos.site/index.php?do=search&subaction=search&story='+q,
          ]
          for url in tests:
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml',
                  'Accept-Language':'ru-RU,ru;q=0.9'})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      body=response.read(150000).decode('utf-8','replace')
                      clean=re.sub(r'<script\\b[^>]*>[\\s\\S]*?</script>','',body,flags=re.I)
                      markers={name:len(re.findall(pattern,clean,re.I)) for name,pattern in {
                          'audio_tags':r'<audio\\b',
                          'mp3_links':r'\\.mp3(?:\\?|[\\\"\\x27])',
                          'track_cards':r'class=[\\\"\\x27][^\\\"\\x27]*(?:track|song|music)[^\\\"\\x27]*',
                          'download_links':r'<a\\b[^>]*(?:download|play)',
                          'html_forms':r'<form\\b',
                          'search_mentions':r'(?:Miyagi|Мияги)',
                      }.items()}
                      print('HITMOS_CANDIDATE',url,'http',response.status,'final',response.url,
                            'bytes',len(body),'title',re.findall(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)[:1],
                            'form_actions',re.findall(r'<form[^>]*action=[\\\"\\x27]([^\\\"\\x27]+)',clean,re.I)[:3],
                            'markers',markers)
              except urllib.error.HTTPError as err:
                  print('HITMOS_CANDIDATE_HTTP',url,err.code,'location',err.headers.get('Location',''))
              except Exception as err:
                  print('HITMOS_CANDIDATE_ERROR',url,type(err).__name__,str(err)[:140])
          PY

      - name: Check redirect targets of the two music sites
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          urls=['https://muzofond.fm/search/Miyagi?page=1',
                'https://muzofond.fm/search/Miyagi',
                'https://ru.hitmoz.org/search?q=Miyagi',
                'https://hitmoz.org/search?q=Miyagi']
          for url in urls:
              try:
                  req=urllib.request.Request(url,method='HEAD',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=12) as res:
                      print('PROVIDER_REDIRECT_PROBE',url,'status',res.status,
                            'destination',res.url,'type',res.headers.get('content-type',''))
              except urllib.error.HTTPError as e:
                  print('PROVIDER_REDIRECT_HTTP',url,e.code,e.headers.get('location',''))
              except Exception as e:
                  print('PROVIDER_REDIRECT_ERROR',url,type(e).__name__,str(e)[:130])
          PY

      - name: Check production search and source counts
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          allowed={'muzo':'[MUZOFOND]','hitmoz':'[HITMOZ]'}
          for query in ['Miyagi','Мика Рамазанова','Кавказ']:
              payload=json.dumps({'action':'search_global','query':query,'page':1,'network':'weak',
                  'mode':'full'},ensure_ascii=False).encode()
              req=urllib.request.Request('https://pl.dagstudio.ru/api.php',data=payload,
                  headers={'Content-Type':'application/json','Accept':'application/json',
                           'User-Agent':'DAGSTUDIO-PLAYER-source-health/2.0'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      data=json.load(response)
                  if data.get('success') is not True:
                      print('SEARCH_ERROR',query,'invalid-response',str(data)[:180])
                      continue
                  sources=data.get('sources',{})
                  counts=data.get('source_counts',{})
                  print('SEARCH',json.dumps({'q':query,'results':len(data.get('data',[])),
                      'sources':{k:{'http':v.get('http',0),'ok':bool(v.get('ok')),
                       'matches':int(counts.get(allowed[k],0) or 0)}
                       for k,v in sources.items() if k in allowed}},ensure_ascii=False))
                  extra=set(sources)-set(allowed)
                  if extra:print('WARNING_PRODUCTION_SEARCH_NOT_UPDATED',sorted(extra))
                  samples={str(t.get('source')):t for t in data.get('data',[]) if t.get('url')}
                  print('SAMPLE_AUDIO_SOURCES',list(samples))
              except Exception as error:
                  print('SOURCE_CHECK_ERROR',query,type(error).__name__,str(error)[:160])
          PY
