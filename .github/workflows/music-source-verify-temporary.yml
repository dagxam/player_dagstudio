name: Temporary server-side music search source verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/music-source-verify-temporary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source scripts
        uses: actions/checkout@v4
      - name: Probe source audio with Range (US runner, not the Russia-hosting test)
        run: |
          php music-source-probe-20261125.php | python -c 'import sys,json; d=json.load(sys.stdin); [print("AUDIO_RESULT",json.dumps({k:x.get(k) for k in ("id","http","explicit_audio_urls","media_hosts","sample_audio_probe")},ensure_ascii=False)) for x in d["results"]]; print("AUDIO_TOTAL",len(d["results"]))'
      - name: Fetch fixed-search probes executed by the DAGSTUDIO hosting server
        run: |
          set -e
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://pl.dagstudio.ru/music-source-probe-20261125.php'
          payload=None
          for attempt in range(20):
              try:
                  req=urllib.request.Request(url,headers={
                      'Accept':'application/json',
                      'Cache-Control':'no-cache',
                      'User-Agent':'DAGSTUDIO-PLAYER-Availability-Audit/1.0'})
                  with urllib.request.urlopen(req,timeout=55) as response:
                      payload=json.load(response)
                  if isinstance(payload.get('results'),list):break
              except Exception as exc:
                  print('PROBE_RETRY',attempt+1,type(exc).__name__,str(exc)[:140],flush=True)
              time.sleep(12)
          if not isinstance(payload,dict) or not isinstance(payload.get('results'),list):
              raise SystemExit('PROBE_NOT_READY: hosting endpoint did not return JSON')
          for row in payload['results']:
              print('SOURCE_SEARCH_LIVE',json.dumps(row,ensure_ascii=False,separators=(',',':')),flush=True)
          print('TOTAL_SOURCES',len(payload['results']),flush=True)
          PY
